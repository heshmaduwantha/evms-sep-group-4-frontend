<div class="sidebar">

  <!-- Logo -->
  <div class="brand">
    <i class="pi pi-shield"></i>
    <span>EVMS</span>
  </div>

  <!-- Menu -->
  <nav class="menu">

    <!-- Dashboard -->
    <a routerLink="/home"
       routerLinkActive="active"
       class="menu-item">

      <div class="left">
        <i class="pi pi-home"></i>
        <span>Dashboard</span>
      </div>

    </a>

    <!-- Events -->
    <a routerLink="/events"
       routerLinkActive="active"
       class="menu-item">

      <div class="left">
        <i class="pi pi-calendar"></i>
        <span>Events Hub</span>
      </div>

    </a>

    <!-- Applications -->
    <a routerLink="/applications"
       routerLinkActive="active"
       class="menu-item">

      <div class="left">
        <i class="pi pi-file"></i>
        <span>Applications</span>
      </div>

    </a>

    <!-- Roles (Expandable) -->
    <div class="menu-group">

      <div class="menu-item expandable"
           (click)="toggleExpand('volunteer')"
           [class.active]="expandedMenu === 'volunteer'">

        <div class="left">
          <i class="pi pi-users"></i>
          <span>Roles</span>
        </div>

        <i class="pi pi-angle-right"
           [class.rotate]="expandedMenu === 'volunteer'"></i>
      </div>

      <!-- Submenu -->
      <div class="submenu"
           [class.open]="expandedMenu === 'volunteer'">

        <a routerLink="/volunteers"
           routerLinkActive="active"
           class="submenu-item">
          View Volunteers
        </a>

        <a routerLink="/volunteers/register"
           routerLinkActive="active"
           class="submenu-item">
          Register Volunteer
        </a>

      </div>

    </div>

    <!-- Settings -->
    <a routerLink="/settings"
       routerLinkActive="active"
       class="menu-item">

      <div class="left">
        <i class="pi pi-cog"></i>
        <span>Settings</span>
      </div>

    </a>

  </nav>

  <!-- Profile -->
  <div class="profile">
    <div class="left">
      <i class="pi pi-user"></i>
      <span>User</span>
    </div>

    <i class="pi pi-sign-out logout"
       (click)="logout()"></i>
  </div>

</div>
